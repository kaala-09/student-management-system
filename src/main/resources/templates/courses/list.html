<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Course Management</h2>

        <a href="/courses/new" class="btn btn-primary">
            Add Course
        </a>

    </div>

    <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Course Name</th>
                <th>Course Code</th>
                <th>Duration</th>
                <th>Description</th>
                <th>Fee</th>
                <th>Paid Amount</th>
                <th>Remaining Balance</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="course : ${courses}">

                <td th:text="${course.id}"></td>

                <td th:text="${course.courseName}"></td>

                <td th:text="${course.courseCode}"></td>

                <td th:text="${course.duration}"></td>

                <td th:text="${course.description}"></td>

                <td th:text="${course.fee}"></td>

                <td th:text="${course.paidAmount}"></td>

                <td th:text="${course.remainingBalance}"></td>

                <td>

                    <a th:href="@{/courses/edit/{id}(id=${course.id})}"
                       class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a th:href="@{/courses/delete/{id}(id=${course.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this course?')">
                        Delete
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
