<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Course</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Course Details</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/courses/save}"
                  th:object="${course}"
                  method="post">

                <!-- Hidden ID for Edit -->
                <input type="hidden" th:field="*{id}">

                <!-- Course Name -->
                <div class="mb-3">
                    <label class="form-label">Course Name</label>

                    <input type="text"
                           th:field="*{courseName}"
                           class="form-control"
                           placeholder="Enter course name"
                           required>
                </div>

                <!-- Course Code -->
                <div class="mb-3">
                    <label class="form-label">Course Code</label>

                    <input type="text"
                           th:field="*{courseCode}"
                           class="form-control"
                           placeholder="Enter course code"
                           required>
                </div>

                <!-- Duration -->
                <div class="mb-3">
                    <label class="form-label">Duration</label>

                    <input type="text"
                           th:field="*{duration}"
                           class="form-control"
                           placeholder="Example:  3-4 years"
                           required>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea th:field="*{description}"
                              class="form-control"
                              rows="3"
                              placeholder="Admission Number, Student Name, Email-id">
                    </textarea>
                </div>

                <!-- Fee -->
                <div class="mb-3">
                    <label class="form-label">Total Course Fee</label>

                    <input type="number"
                           th:field="*{fee}"
                           class="form-control"
                           placeholder="Enter total fee"
                           min="0"
                           step="0.01"
                           required>
                </div>

                <!-- Paid Amount -->
                <div class="mb-3">
                    <label class="form-label">Paid Amount</label>

                    <input type="number"
                           th:field="*{paidAmount}"
                           class="form-control"
                           placeholder="Enter paid amount"
                           min="0"
                           step="0.01"
                           required>
                </div>

                <!-- Buttons -->
                <button type="submit"
                        class="btn btn-success">
                    Save Course
                </button>

                <a href="/courses"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
