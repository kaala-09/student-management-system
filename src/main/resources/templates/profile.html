<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Admin Profile</h3>
        </div>
        <div class="card-body">
            <p><strong>Username:</strong> <span th:text="${admin.username}"></span></p>
            <p><strong>Full Name:</strong> <span th:text="${admin.fullName}"></span></p>
            <p><strong>Email:</strong> <span th:text="${admin.email}"></span></p>
            <p><strong>Mobile Number:</strong> <span th:text="${admin.mobileNumber}"></span></p>
            <a href="/settings" class="btn btn-secondary">Back</a>
        </div>
    </div>
</div>
</body>
</html>
