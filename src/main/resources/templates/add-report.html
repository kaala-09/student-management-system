<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Add Report</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/reports/save}" th:object="${report}" method="post">
                <div class="mb-3">
                    <label class="form-label">Report Title</label>
                    <input type="text" class="form-control" th:field="*{reportTitle}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Student</label>
                    <select class="form-select" th:field="*{student}">
                        <option value="">Select Student</option>
                        <option th:each="student : ${students}" th:value="${student.id}" th:text="${student.firstName + ' ' + student.lastName}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Course</label>
                    <select class="form-select" th:field="*{course}">
                        <option value="">Select Course</option>
                        <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.courseName}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" th:field="*{date}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Remarks</label>
                    <textarea class="form-control" th:field="*{remarks}" rows="4"></textarea>
                </div>
                <button class="btn btn-primary">Save Report</button>
                <a href="/reports" class="btn btn-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
