<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Enrollment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Add Enrollment</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/enrollments/save}" th:object="${enrollment}" method="post">
                <div class="mb-3">
                    <label class="form-label">Student</label>
                    <select class="form-select" th:field="*{student}">
                        <option value="">Select Student</option>
                        <option th:each="student : ${students}" th:value="${student.id}" th:text="${student.firstName + ' ' + student.lastName}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Course</label>
                    <select class="form-select" th:field="*{course}">
                        <option value="">Select Course</option>
                        <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.courseName}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Enrollment Date</label>
                    <input type="date" class="form-control" th:field="*{enrollmentDate}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Course Fee</label>
                    <input type="number" class="form-control" th:field="*{courseFee}" step="0.01">
                </div>
                <div class="mb-3">
                    <label class="form-label">Amount Paid</label>
                    <input type="number" class="form-control" th:field="*{amountPaid}" step="0.01">
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>
                <button class="btn btn-primary">Save Enrollment</button>
                <a href="/enrollments" class="btn btn-secondary ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
