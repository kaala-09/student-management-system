<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Enrollment Management</h2>
        <div>
            <a href="/dashboard" class="btn btn-outline-primary me-2">Dashboard</a>
            <a href="/enrollments/add" class="btn btn-primary">Add Enrollment</a>
        </div>
    </div>
    <form th:action="@{/enrollments}" method="get" class="row g-3 mb-4">
        <div class="col-md-8">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by student, course or status">
        </div>
        <div class="col-md-4">
            <button class="btn btn-success w-100">Search</button>
        </div>
    </form>
    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white">
            <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Course</th>
                <th>Date</th>
                <th>Course Fee</th>
                <th>Amount Paid</th>
                <th>Remaining</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${enrollments}">
                <td th:text="${e.id}"></td>
                <td th:text="${e.student != null ? e.student.firstName + ' ' + e.student.lastName : ''}"></td>
                <td th:text="${e.course != null ? e.course.courseName : ''}"></td>
                <td th:text="${e.enrollmentDate}"></td>
                <td th:text="${e.courseFee}"></td>
                <td th:text="${e.amountPaid}"></td>
                <td th:text="${e.remainingBalance}"></td>
                <td th:text="${e.status}"></td>
                <td>
                    <a th:href="@{/enrollments/edit/{id}(id=${e.id})}" class="btn btn-warning btn-sm">Edit</a>
                    <form th:action="@{/enrollments/delete/{id}(id=${e.id})}" method="post" class="d-inline">
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
