<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Admin Settings</h3>
        </div>
        <div class="card-body">
            <p><strong>Username:</strong> <span th:text="${admin.username}"></span></p>
            <p><strong>Full Name:</strong> <span th:text="${admin.fullName}"></span></p>
            <p><strong>Email:</strong> <span th:text="${admin.email}"></span></p>
            <p><strong>Mobile:</strong> <span th:text="${admin.mobileNumber}"></span></p>
            <div class="mt-4">
                <a href="/profile" class="btn btn-primary">View Profile</a>
                <a href="/change-password" class="btn btn-outline-primary ms-2">Change Password</a>
                <a href="/dashboard" class="btn btn-secondary ms-2">Back</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
