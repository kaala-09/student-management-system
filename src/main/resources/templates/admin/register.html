<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Admin Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
```

</head>

<body class="bg-light">

<div class="container mt-5">

```
<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header bg-primary text-white text-center">
                <h3>Admin Registration</h3>
            </div>

            <div class="card-body">

                <!-- Error Message -->
                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <form th:action="@{/admin/register}"
                      th:object="${admin}"
                      method="post">

                    <!-- Full Name -->
                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input type="text"
                               th:field="*{fullName}"
                               class="form-control"
                               placeholder="Enter your full name"
                               required>

                    </div>

                    <!-- Email -->
                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               placeholder="Enter your email"
                               required>

                    </div>

                    <!-- Mobile Number -->
                    <div class="mb-3">

                        <label class="form-label">
                            Mobile Number
                        </label>

                        <input type="tel"
                               th:field="*{mobileNumber}"
                               class="form-control"
                               placeholder="Enter your mobile number"
                               required>

                    </div>

                    <!-- Password -->
                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               th:field="*{password}"
                               class="form-control"
                               placeholder="Create a password"
                               required>

                    </div>

                    <!-- Register Button -->
                    <div class="d-grid">

                        <button type="submit"
                                class="btn btn-success">

                            Register

                        </button>

                    </div>

                </form>

                <div class="text-center mt-3">

                    <p>
                        Already have an account?
                        <a href="/admin/login">
                            Login here
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>
```

</div>

</body>

</html>
