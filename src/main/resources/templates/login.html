<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd, #0b5ed7); min-height: 100vh; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg border-0" style="width: 420px;">
        <div class="card-body p-4">
            <h3 class="text-center text-primary mb-3">Student Management System</h3>
            <p class="text-center text-muted mb-4">Admin Login</p>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button class="btn btn-primary w-100">Login</button>
                <div th:if="${param.error}" class="alert alert-danger mt-3">Invalid Username or Password</div>
                <div th:if="${param.logout}" class="alert alert-success mt-3">Logout Successful</div>
                <div class="alert alert-info mt-3 small">
                    Default admin<br>
                    Username: admin<br>
                    Password: admin123
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
