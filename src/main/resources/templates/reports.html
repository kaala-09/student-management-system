<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Reports</h2>
        <div>
            <a href="/dashboard" class="btn btn-outline-primary me-2">Dashboard</a>
            <a href="/reports/add" class="btn btn-primary">Add Report</a>
        </div>
    </div>
    <form th:action="@{/reports}" method="get" class="row g-3 mb-4">
        <div class="col-md-8">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search reports by title, student, course or remarks">
        </div>
        <div class="col-md-4">
            <button class="btn btn-success w-100">Search</button>
        </div>
    </form>
    <table class="table table-bordered table-hover bg-white">
        <thead class="table-primary">
        <tr>
            <th>Title</th>
            <th>Student</th>
            <th>Course</th>
            <th>Date</th>
            <th>Remarks</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="report : ${reports}">
            <td th:text="${report.reportTitle}"></td>
            <td th:text="${report.student != null ? report.student.firstName + ' ' + report.student.lastName : ''}"></td>
            <td th:text="${report.course != null ? report.course.courseName : ''}"></td>
            <td th:text="${report.date}"></td>
            <td th:text="${report.remarks}"></td>
            <td>
                <a th:href="@{/reports/edit/{id}(id=${report.id})}" class="btn btn-warning btn-sm">Edit</a>
                <form th:action="@{/reports/delete/{id}(id=${report.id})}" method="post" class="d-inline">
                    <button class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
