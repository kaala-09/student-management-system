<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary">Student Management</h2>
        <div>
            <a href="/dashboard" class="btn btn-outline-primary me-2">Dashboard</a>
            <a href="/students/add" class="btn btn-primary">Add Student</a>
        </div>
    </div>

    <form th:action="@{/students}" method="get" class="row g-3 mb-4">
        <div class="col-md-8">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search by admission number, name, department, phone or email">
        </div>
        <div class="col-md-4">
            <button class="btn btn-success w-100">Search</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-bordered table-hover bg-white">
            <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Admission No.</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Department</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Academic Year</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.admissionNumber}"></td>
                <td th:text="${student.firstName}"></td>
                <td th:text="${student.lastName}"></td>
                <td th:text="${student.department}"></td>
                <td th:text="${student.age}"></td>
                <td th:text="${student.gender}"></td>
                <td th:text="${student.email}"></td>
                <td th:text="${student.phoneNumber}"></td>
                <td th:text="${student.academicYear}"></td>
                <td>
                    <a th:href="@{/students/edit/{id}(id=${student.id})}" class="btn btn-warning btn-sm">Edit</a>
                    <form th:action="@{/students/delete/{id}(id=${student.id})}" method="post" class="d-inline">
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
