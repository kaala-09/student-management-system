<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Add Course</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/courses/save}" th:object="${course}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Course ID</label>
                        <input type="text" class="form-control" th:field="*{courseId}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Course Name</label>
                        <input type="text" class="form-control" th:field="*{courseName}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Course Fee</label>
                        <input type="number" class="form-control" th:field="*{courseFee}" step="0.01" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Amount Paid</label>
                        <input type="number" class="form-control" th:field="*{amountPaid}" step="0.01">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="4"></textarea>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Save Course</button>
                    <a href="/courses" class="btn btn-secondary ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
