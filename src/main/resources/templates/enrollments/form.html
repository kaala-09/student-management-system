<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Enrollment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Student Enrollment</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/enrollments/save}"
                  th:object="${enrollment}"
                  method="post">

                <!-- Student Selection -->
                <div class="mb-3">

                    <label class="form-label">
                        Select Student
                    </label>

                    <select th:field="*{student}"
                            class="form-select"
                            required>

                        <option value="">
                            -- Select Student --
                        </option>

                        <option th:each="student : ${students}"
                                th:value="${student.id}"
                                th:text="${student.firstName + ' ' + student.lastName + ' - ' + student.admissionNumber}">
                        </option>

                    </select>

                </div>

                <!-- Course Selection -->
                <div class="mb-3">

                    <label class="form-label">
                        Select Course
                    </label>

                    <select th:field="*{course}"
                            class="form-select"
                            required>

                        <option value="">
                            -- Select Course --
                        </option>

                        <option th:each="course : ${courses}"
                                th:value="${course.id}"
                                th:text="${course.courseName + ' - ' + course.courseCode}">
                        </option>

                    </select>

                </div>

                <!-- Enrollment Date -->
                <div class="mb-3">

                    <label class="form-label">
                        Enrollment Date
                    </label>

                    <input type="date"
                           th:field="*{enrollmentDate}"
                           class="form-control"
                           required>

                </div>

                <!-- Buttons -->
                <button type="submit"
                        class="btn btn-success">

                    Save Enrollment

                </button>

                <a href="/enrollments"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
