<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Enrollments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Student Enrollments</h2>

        <a href="/enrollments/new" class="btn btn-primary">
            Add Enrollment
        </a>

    </div>

    <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Student Name</th>
                <th>Course Name</th>
                <th>Enrollment Date</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="enrollment : ${enrollments}">

                <td th:text="${enrollment.id}"></td>

                <td th:text="${enrollment.student.firstName + ' ' + enrollment.student.lastName}">
                </td>

                <td th:text="${enrollment.course.courseName}">
                </td>

                <td th:text="${enrollment.enrollmentDate}">
                </td>

                <td>

                    <a th:href="@{/enrollments/delete/{id}(id=${enrollment.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this enrollment?')">

                        Delete

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>

</html>
