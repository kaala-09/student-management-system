<form action="/login" method="POST">

    <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required>
    </div>

    <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required>
    </div>

    <button type="submit">
        <i class="fa-solid fa-right-to-bracket"></i>
        Login
    </button>

</form>
