<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Course Management</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6f9;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #24408f;
            color: white;
            padding: 30px 20px;
        }

        .sidebar h2 {
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
        }

        .main {
            flex: 1;
        }

        .topbar {
            background: white;
            padding: 25px 40px;
        }

        .content {
            padding: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #24408f;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        button {
            background: #2864df;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="sidebar">

        <h2>Admin Panel</h2>

        <a href="/admin.html">🏠 Dashboard</a>

        <a href="/student-management.html">
            👨‍🎓 Manage Students
        </a>

        <a href="/add-student.html">
            ➕ Add Student
        </a>

        <a href="/course.html">
            📚 Courses
        </a>

        <a href="/enrollments.html">
            📝 Enrollments
        </a>

        <a href="/reports.html">
            📊 Reports
        </a>

        <a href="/settings.html">
            ⚙️ Settings
        </a>

    </div>

    <div class="main">

        <div class="topbar">

            <h1></h1>

        </div>

        <div class="content">

            <h2>Course Management</h2>

            <button onclick="addCourse()">
                Add Course
            </button>

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Course Name</th>

                    <th>Course Code</th>

                    <th>Duration</th>

                    <th>Fee</th>

                </tr>

                </thead>

                <tbody id="courseTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

    function loadCourses() {

        fetch("/api/courses")

            .then(response => response.json())

            .then(courses => {

                let table =
                    document.getElementById("courseTable");

                table.innerHTML = "";

                courses.forEach(course => {

                    table.innerHTML += `

                        <tr>

                            <td>${course.id}</td>

                            <td>${course.courseName}</td>

                            <td>${course.courseCode}</td>

                            <td>${course.duration}</td>

                            <td>${course.fee}</td>

                        </tr>

                    `;

                });

            })

            .catch(error => {

                console.log(error);

            });

    }


    function addCourse() {

        alert("Course form will be added next");

    }


    loadCourses();

</script>

</body>

</html>
