<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Students</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #294797;
            color: white;
            padding-top: 45px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 45px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 18px 35px;
            font-size: 17px;
        }

        .sidebar a:hover {
            background: #1d377d;
        }

        .main {
            margin-left: 250px;
        }

        .topbar {
            height: 88px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 2px 8px #ddd;
        }

        .topbar h1 {
            color: #294797;
        }

        .logout {
            background: #ef2b2d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        .content {
            padding: 55px 40px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .title-row h2 {
            font-size: 30px;
        }

        .add-btn {
            background: #2864d7;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 6px;
            font-size: 16px;
        }

        .table-container {
            background: white;
            overflow-x: auto;
            box-shadow: 0 2px 8px #ddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th {
            background: #294797;
            color: white;
            padding: 16px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .edit-btn {
            background: #f4b400;
            color: black;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background: #ef2b2d;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .message {
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h2>Admin Panel</h2>

        <a href="admin.html">🏠 Dashboard</a>

        <a href="student-management.html">
            👨‍🎓 Manage Students
        </a>

        <a href="add-student.html">
            ➕ Add Student
        </a>

        <a href="course.html">
            📚 Courses
        </a>

        <a href="enrollments.html">
            📝 Enrollments
        </a>

        <a href="reports.html">
            📊 Reports
        </a>

        <a href="settings.html">
            ⚙️ Settings
        </a>

    </div>


    <!-- MAIN CONTENT -->
    <div class="main">

        <!-- TOP BAR -->
        <div class="topbar">

            <h1></h1>

            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>


        <!-- CONTENT -->
        <div class="content">

            <div class="title-row">

                <h2>Manage Students</h2>

                <a href="add-student.html" class="add-btn">
                    Add Student
                </a>

            </div>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Admission Number</th>

                            <th>First Name</th>

                            <th>Last Name</th>

                            <th>Email</th>

                            <th>Phone</th>

                            <th>Age</th>

                            <th>Department</th>

                            <th>Gender</th>

                            <th>Academic Year</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="studentTableBody">

                        <tr>

                            <td colspan="11" class="message">
                                Loading students...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        // LOAD ALL STUDENTS
        function loadStudents() {

            fetch("/api/students")

                .then(response => {

                    if (!response.ok) {

                        throw new Error("Failed to load students");

                    }

                    return response.json();

                })

                .then(students => {

                    const tableBody =
                        document.getElementById("studentTableBody");

                    tableBody.innerHTML = "";


                    if (students.length === 0) {

                        tableBody.innerHTML = `

                            <tr>

                                <td colspan="11"
                                    class="message">

                                    No students found

                                </td>

                            </tr>

                        `;

                        return;

                    }


                    students.forEach(student => {

                        const row = document.createElement("tr");


                        row.innerHTML = `

                            <td>
                                ${student.id || ""}
                            </td>

                            <td>
                                ${student.admissionNumber || ""}
                            </td>

                            <td>
                                ${student.firstName || ""}
                            </td>

                            <td>
                                ${student.lastName || ""}
                            </td>

                            <td>
                                ${student.email || ""}
                            </td>

                            <td>
                                ${student.phone || ""}
                            </td>

                            <td>
                                ${student.age || ""}
                            </td>

                            <td>
                                ${student.department || ""}
                            </td>

                            <td>
                                ${student.gender || ""}
                            </td>

                            <td>
                                ${student.academicYear || ""}
                            </td>

                            <td>

                                <button
                                    class="edit-btn"
                                    onclick="editStudent(${student.id})">

                                    Edit

                                </button>


                                <button
                                    class="delete-btn"
                                    onclick="deleteStudent(${student.id})">

                                    Delete

                                </button>

                            </td>

                        `;


                        tableBody.appendChild(row);

                    });

                })

                .catch(error => {

                    console.error(error);

                    document.getElementById("studentTableBody").innerHTML = `

                        <tr>

                            <td colspan="11"
                                class="message">

                                Error loading students

                            </td>

                        </tr>

                    `;

                });

        }


        // DELETE STUDENT
        function deleteStudent(id) {

            if (!confirm("Are you sure you want to delete this student?")) {

                return;

            }


            fetch(`/api/students/${id}`, {

                method: "DELETE"

            })

            .then(response => {

                if (response.ok) {

                    alert("Student deleted successfully");

                    loadStudents();

                } else {

                    alert("Failed to delete student");

                }

            })

            .catch(error => {

                console.error(error);

                alert("Error deleting student");

            });

        }


        // EDIT STUDENT
        function editStudent(id) {

            window.location.href =
                `add-student.html?id=${id}`;

        }


        // LOGOUT
        function logout() {

            window.location.href = "login.html";

        }


        // LOAD DATA WHEN PAGE OPENS
        loadStudents();

    </script>

</body>

</html>
