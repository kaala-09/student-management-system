<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Enrollments</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6f9;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #24408f;
            color: white;
            padding: 30px 20px;
        }

        .sidebar h2 {
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px;
        }

        .main {
            flex: 1;
        }

        .topbar {
            background: white;
            padding: 25px 40px;
        }

        .content {
            padding: 40px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
        }

        th {
            background: #24408f;
            color: white;
            padding: 15px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="sidebar">

        <h2>Admin Panel</h2>

        <a href="/admin.html">🏠 Dashboard</a>

        <a href="/student-management.html">
            👨‍🎓 Manage Students
        </a>

        <a href="/add-student.html">
            ➕ Add Student
        </a>

        <a href="/course.html">
            📚 Courses
        </a>

        <a href="/enrollments.html">
            📝 Enrollments
        </a>

        <a href="/reports.html">
            📊 Reports
        </a>

        <a href="/settings.html">
            ⚙️ Settings
        </a>

    </div>

    <div class="main">

        <div class="topbar">

            <h1></h1>

        </div>

        <div class="content">

            <h2>Student Enrollments</h2>

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Student Name</th>

                    <th>Course Name</th>

                    <th>Enrollment Date</th>

                </tr>

                </thead>

                <tbody id="enrollmentTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

    fetch("/api/enrollments")

        .then(response => response.json())

        .then(enrollments => {

            const table =
                document.getElementById("enrollmentTable");

            enrollments.forEach(enrollment => {

                table.innerHTML += `

                    <tr>

                        <td>${enrollment.id}</td>

                        <td>${enrollment.studentName}</td>

                        <td>${enrollment.courseName}</td>

                        <td>${enrollment.enrollmentDate}</td>

                    </tr>

                `;

            });

        })

        .catch(error => {

            console.log(error);

        });

</script>

</body>

</html>
